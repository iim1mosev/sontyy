<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كل سنة وإنتي طيبة يا حسونتي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600&display=swap">
<style>
:root{
  --bg:#ffe3ea; --bg2:#ffc8d6; --ink:#4a1236; --accent:#d93a68; --gold:#b9801f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#2a0b20; --bg2:#4a1236; --ink:#ffe3ea; --accent:#ff7a9c; --gold:#f3c677;}
}
:root[data-theme="dark"]{--bg:#2a0b20; --bg2:#4a1236; --ink:#ffe3ea; --accent:#ff7a9c; --gold:#f3c677;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(circle at 50% 35%,var(--bg2),var(--bg) 70%);
  color:var(--ink);
  font-family:"Cairo","Segoe UI",Tahoma,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;text-align:center;
}
main{position:relative;z-index:2;padding:24px;max-width:100%}
.heart{
  width:84px;height:84px;margin:0 auto 12px;color:var(--accent);
  animation:beat 1.6s ease-in-out infinite;cursor:pointer;
}
h1{
  font-family:"Aref Ruqaa","Amiri","Traditional Arabic",serif;
  font-weight:700;font-size:clamp(2.4rem,10vw,5.2rem);
  line-height:1.5;margin:0;
}
h1 span{display:block;opacity:0;transform:translateY(14px);animation:in .9s ease forwards}
h1 span:nth-child(1){animation-delay:.3s}
h1 span:nth-child(2){animation-delay:1.1s;color:var(--accent)}
p{margin:18px 0 0;font-size:1.15rem;color:var(--gold);opacity:0;animation:in .9s ease 2s forwards}
.float{position:fixed;bottom:-40px;color:var(--accent);pointer-events:none;z-index:1;animation:up linear forwards}
@keyframes in{to{opacity:1;transform:none}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes up{to{transform:translateY(-115vh) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){
  .heart{animation:none}
  h1 span,p{animation-duration:.01s;animation-delay:0s}
}
</style>
</head>
<body>
<main>
  <svg class="heart" id="h" viewBox="0 0 24 24" role="button" aria-label="قلوب" tabindex="0" fill="currentColor">
    <path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.6 4.5c2 0 3.7 1.1 5.4 3.2 1.7-2.1 3.4-3.2 5.4-3.2 3.8 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z"/>
  </svg>
  <h1><span>كل سنة وإنتي طيبة</span><span>يا حسونتي</span></h1>
</main>
<script>
(function(){
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function drop(){
    if(reduce) return;
    var s = document.createElement("span");
    s.className = "float";
    s.textContent = "♥";
    s.style.left = Math.random()*100 + "vw";
    s.style.fontSize = (14 + Math.random()*30) + "px";
    s.style.setProperty("--r", (Math.random()*60-30) + "deg");
    s.style.animationDuration = (4 + Math.random()*4) + "s";
    document.body.appendChild(s);
    setTimeout(function(){ s.remove(); }, 8500);
  }
  var timer = setInterval(drop, 600);
  var h = document.getElementById("h");
  function burst(){ for(var i=0;i<14;i++) setTimeout(drop, i*90); }
  h.addEventListener("click", burst);
  h.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); burst(); } });
  burst();
})();
</script>
</body>
</html>
